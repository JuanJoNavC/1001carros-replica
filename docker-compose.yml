services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carros1001
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - carros1001_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carros1001"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carros1001_postgres:
